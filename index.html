```html
<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Entorno Python - Informática</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f5;
}

.contenedor {
    max-width: 1000px;
    margin: 30px auto;
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,0.18);
}

/* ENCABEZADO */

.encabezado {
    background: #263238;
    color: white;
    padding: 25px;
    text-align: center;
}

.encabezado .icono {
    font-size: 45px;
}

.encabezado h1 {
    margin: 5px 0;
}

.encabezado p {
    margin: 5px;
}

/* CONTENIDO */

.contenido {
    padding: 25px;
}

.titulo {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 10px;
}

/* EDITOR */

textarea {
    width: 100%;
    height: 300px;
    resize: vertical;

    background: #111;
    color: #00ff66;

    border: none;
    border-radius: 10px;

    padding: 18px;

    font-family: Consolas, monospace;
    font-size: 16px;

    outline: none;
}

/* BOTONES */

.botones {
    margin-top: 15px;

    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 8px;

    padding: 12px 20px;

    font-size: 16px;
    cursor: pointer;

    color: white;
}

.ejecutar {
    background: #2e7d32;
}

.limpiar {
    background: #607d8b;
}

.restaurar {
    background: #1976d2;
}

button:hover {
    opacity: 0.85;
}

/* CONSOLA */

.consola {
    margin-top: 25px;
}

#salida {
    background: #111;
    color: #00ff66;

    min-height: 180px;

    border-radius: 10px;

    padding: 18px;

    font-family: Consolas, monospace;
    font-size: 16px;

    white-space: pre-wrap;

    overflow-y: auto;
}

/* ESTADO */

.estado {
    margin-top: 12px;
    font-size: 14px;
    color: #555;
}

/* PIE */

.pie {
    background: #eceff1;
    text-align: center;
    padding: 12px;
    color: #455a64;
}

</style>

</head>


<body>


<div class="contenedor">


<!-- ENCABEZADO -->

<div class="encabezado">

<div class="icono">🐍</div>

<h1>Mi entorno Python</h1>

<p>Escribí tu programa y ejecutalo directamente en el navegador</p>

</div>


<div class="contenido">


<!-- EDITOR -->

<div class="titulo">
💻 Código Python
</div>


<textarea id="codigo">print("Hola, soy estudiante de Informática")

nombre = input("¿Cómo te llamás? ")

print("Hola", nombre)
print("¡Bienvenido a Python!")</textarea>


<!-- BOTONES -->

<div class="botones">

<button class="ejecutar" onclick="ejecutarPython()">
▶️ Ejecutar
</button>

<button class="limpiar" onclick="limpiarConsola()">
🧹 Limpiar
</button>

<button class="restaurar" onclick="restaurarCodigo()">
🔄 Código inicial
</button>

</div>


<!-- ESTADO -->

<div class="estado" id="estado">
⏳ Cargando Python...
</div>


<!-- CONSOLA -->

<div class="consola">

<div class="titulo">
🖥️ Consola
</div>

<div id="salida">
Esperando a que Python esté listo...
</div>

</div>


</div>


<!-- PIE -->

<div class="pie">

🐍 Python para aprender programación

</div>


</div>


<!-- PYODIDE -->

<script src="https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js"></script>


<script>

let pyodide = null;

const codigoInicial = `
print("Hola, soy estudiante de Informática")

nombre = input("¿Cómo te llamás? ")

print("Hola", nombre)
print("¡Bienvenido a Python!")
`;


/* --------------------------------------------------
   CARGAR PYTHON
-------------------------------------------------- */

async function cargarPython() {

    try {

        document.getElementById("estado").innerText =
            "⏳ Cargando Python...";

        pyodide = await loadPyodide();

        document.getElementById("estado").innerText =
            "🟢 Python listo para ejecutar";

        document.getElementById("salida").innerText =
            "Python está listo.\n\nPresioná ▶️ Ejecutar.";

    }

    catch(error) {

        document.getElementById("estado").innerText =
            "🔴 Error al cargar Python";

        document.getElementById("salida").innerText =
            error;

    }

}


/* --------------------------------------------------
   EJECUTAR PYTHON
-------------------------------------------------- */

async function ejecutarPython() {

    if (!pyodide) {

        alert("Esperá unos segundos. Python todavía se está cargando.");

        return;
    }


    const codigo =
        document.getElementById("codigo").value;


    const salida =
        document.getElementById("salida");


    salida.innerText = "";


    /*
       Capturamos print()
    */

    let resultado = "";


    pyodide.setStdout({

        batched: (texto) => {

            resultado += texto + "\n";

            salida.innerText = resultado;

        }

    });


    /*
       Ejecutamos el programa
    */

    try {

        await pyodide.runPythonAsync(codigo);

    }

    catch(error) {

        salida.innerText +=
            "\n❌ ERROR:\n" +
            error;

    }

}


/* --------------------------------------------------
   LIMPIAR
-------------------------------------------------- */

function limpiarConsola() {

    document.getElementById("salida").innerText =
        "Consola limpia.\n\nPresioná ▶️ Ejecutar.";

}


/* --------------------------------------------------
   RESTAURAR
-------------------------------------------------- */

function restaurarCodigo() {

    document.getElementById("codigo").value =
        codigoInicial;

    document.getElementById("salida").innerText =
        "Código inicial restaurado.";

}


/* --------------------------------------------------
   INICIAR
-------------------------------------------------- */

cargarPython();

</script>


</body>

</html>
```
