<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐍 Mi entorno Python</title>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:20px;
}

.contenedor{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
}

.editor{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px #ccc;
}

textarea{
    width:100%;
    height:260px;
    font-family:Consolas, monospace;
    font-size:16px;
    padding:12px;
    box-sizing:border-box;
    border-radius:8px;
    border:1px solid #aaa;
    resize:vertical;
}

button{
    margin-top:12px;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.ejecutar{
    background:#333;
    color:white;
}

.limpiar{
    background:#ddd;
}

.consola{
    margin-top:20px;
    background:#111;
    color:#00ff66;
    padding:15px;
    border-radius:10px;
    min-height:120px;
    white-space:pre-wrap;
    font-family:Consolas,monospace;
}

.entrada{
    margin-top:20px;
    background:white;
    padding:15px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    box-sizing:border-box;
    margin-top:8px;
    font-size:16px;
}

.estado{
    margin-bottom:15px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="contenedor">

<h1>🐍 Mi entorno Python</h1>

<div class="editor">

<div id="estado" class="estado">
⏳ Cargando Python...
</div>

<label><strong>💻 Escribí tu código:</strong></label>

<textarea id="codigo">print("Hola, soy estudiante de Informática")</textarea>

<div class="entrada">

<strong>⌨️ Datos de entrada</strong>

<p>
Si tu programa utiliza <code>input()</code>, escribí aquí el dato que quieras ingresar.
</p>

<input id="dato" type="text" placeholder="Escribí aquí tu respuesta">

</div>

<button class="ejecutar" onclick="ejecutarCodigo()">
▶️ Ejecutar
</button>

<button class="limpiar" onclick="limpiarConsola()">
🗑️ Limpiar consola
</button>

<div>

<h3>🖥️ Consola</h3>

<div id="consola" class="consola">
Esperando ejecución...
</div>

</div>

</div>

</div>


<script>

let pyodide = null;


/* CARGAR PYTHON */

async function iniciarPython(){

    try{

        pyodide = await loadPyodide();

        document.getElementById("estado").innerText =
            "✅ Python listo para ejecutar";

    }catch(error){

        document.getElementById("estado").innerText =
            "❌ No se pudo cargar Python";

        console.error(error);

    }

}

iniciarPython();


/* REEMPLAZAR INPUT */

function prepararCodigo(codigo){

    const dato = document.getElementById("dato").value;

    /*
       Busca:
       input()
       input("mensaje")
       input('mensaje')
    */

    codigo = codigo.replace(
        /input\s*\(\s*(?:"([^"]*)"|'([^']*)')?\s*\)/g,
        function(){

            return JSON.stringify(dato);

        }
    );

    return codigo;

}


/* EJECUTAR */

async function ejecutarCodigo(){

    const consola =
        document.getElementById("consola");

    if(!pyodide){

        consola.innerText =
            "⏳ Python todavía se está cargando...";

        return;

    }

    let codigo =
        document.getElementById("codigo").value;

    if(codigo.trim() === ""){

        consola.innerText =
            "⚠️ Escribí algún código Python.";

        return;

    }


    codigo = prepararCodigo(codigo);


    consola.innerText =
        "▶️ Ejecutando...\n";


    try{

        /*
        Creamos un pequeño programa
        que captura lo que produce print()
        */

        const codigoSeguro = JSON.stringify(codigo);

        const programa = `

import sys
import io

_buffer = io.StringIO()

_stdout_original = sys.stdout

sys.stdout = _buffer

try:

    exec(${codigoSeguro}, {})

finally:

    sys.stdout = _stdout_original

_buffer.getvalue()

`;


        const resultado =
            await pyodide.runPythonAsync(programa);


        consola.innerText =
            resultado || "(El programa no mostró ningún resultado.)";


    }catch(error){

        consola.innerText =
            "❌ ERROR:\\n\\n" +
            error;

    }

}


/* LIMPIAR */

function limpiarConsola(){

    document.getElementById("consola").innerText =
        "Consola limpia.";

}

</script>

</body>
</html>
