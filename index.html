<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🐍 Mi entorno Python</title>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:20px;
}

.contenedor{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
}

.editor{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px #ccc;
}

textarea{
    width:100%;
    height:250px;
    font-family:Consolas,monospace;
    font-size:16px;
    padding:12px;
    box-sizing:border-box;
    border-radius:8px;
    border:1px solid #aaa;
}

button{
    margin-top:12px;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.ejecutar{
    background:#333;
    color:white;
}

.limpiar{
    background:#ddd;
}

.entrada{
    margin-top:20px;
    background:#f1f1f1;
    padding:15px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    box-sizing:border-box;
    font-size:16px;
    margin-top:8px;
}

.consola{
    margin-top:20px;
    background:#111;
    color:#00ff66;
    padding:15px;
    border-radius:10px;
    min-height:120px;
    white-space:pre-wrap;
    font-family:Consolas,monospace;
}

.estado{
    font-weight:bold;
    margin-bottom:15px;
}

</style>

</head>


<body>

<div class="contenedor">

<h1>🐍 Mi entorno Python</h1>

<div class="editor">

<div id="estado" class="estado">
⏳ Cargando Python...
</div>


<label>
<strong>💻 Escribí tu código:</strong>
</label>

<textarea id="codigo">print("Hola, soy estudiante de Informática")</textarea>


<div class="entrada">

<strong>⌨️ Datos de entrada</strong>

<p>
Si utilizás <code>input()</code>, escribí aquí el dato.
</p>

<input
id="dato"
type="text"
placeholder="Escribí aquí tu respuesta"
>

</div>


<button
class="ejecutar"
onclick="ejecutarCodigo()">

▶️ Ejecutar

</button>


<button
class="limpiar"
onclick="limpiarConsola()">

🗑️ Limpiar

</button>


<h3>🖥️ Consola</h3>

<div id="consola" class="consola">

Esperando ejecución...

</div>

</div>

</div>


<script>

let pyodide = null;


/* CARGAR PYTHON */

async function iniciarPython(){

    try{

        pyodide = await loadPyodide();

        document.getElementById("estado").innerText =
            "✅ Python listo para ejecutar";

    }

    catch(error){

        document.getElementById("estado").innerText =
            "❌ Error al cargar Python";

        console.error(error);

    }

}

iniciarPython();


/* PREPARAR INPUT */

function prepararCodigo(codigo){

    const dato =
        document.getElementById("dato").value;


    codigo = codigo.replace(

        /input\s*\(\s*(?:"([^"]*)"|'([^']*)')?\s*\)/g,

        function(){

            return JSON.stringify(dato);

        }

    );


    return codigo;

}


/* EJECUTAR PYTHON */

async function ejecutarCodigo(){

    const consola =
        document.getElementById("consola");


    if(!pyodide){

        consola.innerText =
            "⏳ Python todavía se está cargando...";

        return;

    }


    let codigo =
        document.getElementById("codigo").value;


    if(codigo.trim() === ""){

        consola.innerText =
            "⚠️ Escribí código Python.";

        return;

    }


    codigo =
        prepararCodigo(codigo);


    consola.innerText =
        "▶️ Ejecutando...";


    try{

        const codigoSeguro =
            JSON.stringify(codigo);


        const programa = `

import sys
import io

_buffer = io.StringIO()

_stdout_original = sys.stdout

sys.stdout = _buffer

try:

    exec(${codigoSeguro}, {})

finally:

    sys.stdout = _stdout_original

_salida = _buffer.getvalue()

`;


        await pyodide.runPythonAsync(programa);


        const resultado =
            pyodide.globals.get("_salida");


        consola.innerText =
            resultado
            ? resultado.toString()
            : "(Sin salida)";


    }

    catch(error){

        consola.innerText =
            "❌ ERROR:\\n\\n" +
            String(error);

    }

}


/* LIMPIAR */

function limpiarConsola(){

    document.getElementById("consola").innerText =
        "Consola limpia.";

}

</script>

</body>

</html>
